
    build_script:
        - ps: |
              Write-Host "Installing Java 11..."
              
              choco install temurin11 -y --params='/ADDLOCAL=FeatureMain,FeatureEnvironment,FeatureJavaHome /quiet'
              
              if (Get-Command refreshenv -ErrorAction SilentlyContinue) {
                  refreshenv
              }
              
              Write-Host "Searching for JDK 11..."
              
              $jdkRoots = @(
                  'C:\Program Files\Temurin',
                  'C:\Program Files\Eclipse Adoptium',
                  'C:\Program Files\Java'
              )
              
              $javac = $null
              
              foreach ($root in $jdkRoots) {
                  if (Test-Path $root) {
                      $javac = Get-ChildItem $root -Filter javac.exe -File -Recurse -ErrorAction SilentlyContinue |
                          Select-Object -First 1
              
                      if ($javac) {
                          break
                      }
                  }
              }
              
              if (-not $javac) {
                  throw "JDK 11 not found! Could not locate javac.exe."
              }
              
              $env:JAVA_HOME = Split-Path (Split-Path $javac.FullName -Parent) -Parent
              $env:Path = "$env:JAVA_HOME\bin;$env:Path"
              
              Write-Host "JAVA_HOME: $env:JAVA_HOME"
              Write-Host "Checking Java version:"
              
              java -version
              javac -version
              
              Write-Host "Starting application..."
              
              $app = Start-Process -FilePath "$env:JAVA_HOME\bin\java.exe" `
                  -ArgumentList '-jar', './artifacts/app-order.jar' `
                  -WorkingDirectory $env:APPVEYOR_BUILD_FOLDER `
                  -RedirectStandardOutput "$env:APPVEYOR_BUILD_FOLDER\app.log" `
                  -RedirectStandardError "$env:APPVEYOR_BUILD_FOLDER\app-error.log" `
                  -PassThru
              
              Write-Host "Waiting for application..."
              
              $ready = $false
              
              for ($i = 0; $i -lt 30; $i++) {
                  try {
                      Invoke-WebRequest -Uri "http://localhost:9999" `
                          -UseBasicParsing -TimeoutSec 2 | Out-Null
              
                      $ready = $true
                      break
                  }
                  catch {
                      Start-Sleep -Seconds 2
                  }
              }
              
              if (-not $ready) {
                  Write-Host "Application failed to start!"
              
                  if (Test-Path "$env:APPVEYOR_BUILD_FOLDER\app.log") {
                      Get-Content "$env:APPVEYOR_BUILD_FOLDER\app.log"
                  }
              
                  if (Test-Path "$env:APPVEYOR_BUILD_FOLDER\app-error.log") {
                      Get-Content "$env:APPVEYOR_BUILD_FOLDER\app-error.log"
                  }
              
                  throw "Application did not start on port 9999!"
              }
              
              Write-Host "Application is ready!"
              Write-Host "Starting Gradle tests..."
              
              cmd.exe /c ".\gradlew.bat clean build"
              
              if ($LASTEXITCODE -ne 0) {
                  throw "Gradle build failed with exit code $LASTEXITCODE"
              }
              
              Write-Host "Gradle build completed successfully!"